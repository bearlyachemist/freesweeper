<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herbal Tea Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..800,100,1&display=swap" rel="stylesheet">
<style>
  :root { --bg: #FBF7EE; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: grid; place-items: center; }
  svg { width: min(92vw, 92vh); height: auto; }
  .word { font-family: 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 1040" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Herbal Tea Studios">
  <defs>
    <!-- Reusable leaf, base at origin pointing right -->
    <g id="leaf">
      <path d="M0,0 C10,-15 30,-17 42,0 C30,15 10,14 0,0 Z" fill="#8DB36B" stroke="#3E5F4A" stroke-width="4" stroke-linejoin="round"/>
      <path d="M3,0 C15,-2 26,-1 36,0" fill="none" stroke="#3E5F4A" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <g stroke="#3E5F4A" stroke-linecap="round" stroke-linejoin="round" transform="translate(-30,0)">

    <!-- Steam: one wisp sprouts a leaf -->
    <path d="M420,305 C392,272 448,248 420,212 C400,186 430,166 440,150" fill="none" stroke="#A7C08A" stroke-width="13"/>
    <path d="M520,300 C548,270 500,250 528,218 C540,204 546,196 548,186" fill="none" stroke="#A7C08A" stroke-width="13"/>
    <use href="#leaf" transform="translate(548,186) rotate(-62) scale(1.05)"/>
    <use href="#leaf" transform="translate(546,192) rotate(-150) scale(0.75)"/>

    <!-- Saucer -->
    <ellipse cx="470" cy="672" rx="272" ry="40" fill="#E9E1CC" stroke-width="13"/>
    <ellipse cx="470" cy="664" rx="150" ry="16" fill="none" stroke="#D3C8AC" stroke-width="7"/>

    <!-- Handle -->
    <path d="M668,438 C760,410 800,500 742,548 C712,574 676,578 650,572" fill="none" stroke-width="40"/>
    <path d="M668,438 C760,410 800,500 742,548 C712,574 676,578 650,572" fill="none" stroke="#FFF9EC" stroke-width="16"/>

    <!-- Cup body -->
    <path d="M258,380 C262,520 300,652 470,658 C640,652 678,520 682,380 Z" fill="#FFF9EC" stroke-width="14"/>
    <!-- glaze shine -->
    <path d="M300,420 C304,500 318,560 350,600" fill="none" stroke="#EDE5D0" stroke-width="16"/>
    <!-- glaze band -->
    <path d="M270,452 C400,478 540,478 672,452" fill="none" stroke="#A7C08A" stroke-width="9" opacity=".75"/>

    <!-- Rim + tea -->
    <ellipse cx="470" cy="380" rx="212" ry="50" fill="#FFF9EC" stroke-width="14"/>
    <ellipse cx="470" cy="386" rx="186" ry="34" fill="#D7A85E" stroke="none"/>
    <path d="M340,382 C380,366 430,362 470,364" fill="none" stroke="#F1D19A" stroke-width="9"/>
    <use href="#leaf" transform="translate(372,394) rotate(-12) scale(0.8)"/>

    <!-- Face: half-lidded, one brow up, rosy cheeks, lopsided grin -->
    <ellipse cx="368" cy="560" rx="26" ry="14" fill="#F2A493" stroke="none" opacity=".55"/>
    <ellipse cx="582" cy="560" rx="26" ry="14" fill="#F2A493" stroke="none" opacity=".55"/>
    <path d="M378,512 h52" fill="none" stroke-width="10"/>
    <path d="M388,514 a15,15 0 0 0 30,0 Z" fill="#3E5F4A" stroke-width="4"/>
    <path d="M522,512 h52" fill="none" stroke-width="10"/>
    <path d="M532,514 a15,15 0 0 0 30,0 Z" fill="#3E5F4A" stroke-width="4"/>
    <path d="M524,478 C540,464 562,464 576,474" fill="none" stroke-width="9"/>
    <path d="M436,572 C462,598 506,596 530,566" fill="none" stroke-width="11"/>
    <path d="M524,560 l12,8" fill="none" stroke-width="8"/>

    <!-- Tea-bag string -> controller cord -->
    <path d="M598,392 C606,356 636,346 648,366 C652,420 640,520 648,600 C656,676 690,712 730,716 C760,718 772,706 784,700" fill="none" stroke-width="7"/>
    <!-- string tag knot on rim -->
    <circle cx="647" cy="378" r="6" fill="#3E5F4A" stroke="none"/>

    <!-- Controller -->
    <ellipse cx="822" cy="782" rx="120" ry="16" fill="#3E5F4A" stroke="none" opacity=".12"/>
    <g transform="translate(818,740) rotate(-8) scale(0.92)">
      <!-- shoulder buttons -->
      <rect x="-86" y="-50" width="48" height="22" rx="10" fill="#7E9E62" stroke-width="7"/>
      <rect x="38" y="-50" width="48" height="22" rx="10" fill="#7E9E62" stroke-width="7"/>
      <!-- body -->
      <path d="M-72,-38 H72 C100,-38 112,-20 118,4 L130,46 C136,72 110,86 90,66 L66,42 H-66 L-90,66 C-110,86 -136,72 -130,46 L-118,4 C-112,-20 -100,-38 -72,-38 Z" fill="#A9C78A" stroke-width="8"/>
      <!-- body highlight -->
      <path d="M-74,-26 H40" fill="none" stroke="#CFE2B6" stroke-width="7"/>
      <!-- cord port -->
      <rect x="-10" y="-50" width="20" height="14" rx="4" fill="#3E5F4A" stroke="none"/>
      <!-- d-pad well + cross -->
      <circle cx="-66" cy="4" r="30" fill="#8FB070" stroke="none"/>
      <path d="M-74,-18 h16 v14 h14 v16 h-14 v14 h-16 v-14 h-14 v-16 h14 Z" fill="#3E5F4A" stroke-width="3"/>
      <!-- face buttons -->
      <circle cx="66" cy="4" r="30" fill="#8FB070" stroke="none"/>
      <circle cx="80" cy="-6" r="11" fill="#E07A5F" stroke-width="5"/>
      <circle cx="56" cy="14" r="11" fill="#F2C14E" stroke-width="5"/>
      <!-- select / start -->
      <rect x="-26" y="2" width="18" height="8" rx="4" fill="#3E5F4A" stroke="none"/>
      <rect x="8" y="2" width="18" height="8" rx="4" fill="#3E5F4A" stroke="none"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text class="word" x="500" y="910" text-anchor="middle" font-size="132" font-weight="700" fill="#3E5F4A" letter-spacing="-2">Herbal Tea</text>

  <!-- Branch flourish carrying STUDIOS -->
  <g stroke="#6E8B55" stroke-linecap="round" fill="none">
    <path d="M232,962 C290,950 330,972 382,960" stroke-width="7"/>
    <path d="M618,960 C670,972 710,950 768,962" stroke-width="7"/>
  </g>
  <use href="#leaf" transform="translate(272,956) rotate(-40) scale(0.7)"/>
  <use href="#leaf" transform="translate(340,964) rotate(30) scale(0.6)"/>
  <use href="#leaf" transform="translate(728,956) rotate(-140) scale(0.7)"/>
  <use href="#leaf" transform="translate(660,964) rotate(150) scale(0.6)"/>
  <text class="word" x="500" y="972" text-anchor="middle" font-size="34" font-weight="500" fill="#6E8B55" letter-spacing="10" style="font-variation-settings:'SOFT' 100,'opsz' 36">STUDIOS</text>
</svg>
</body>
</html>
