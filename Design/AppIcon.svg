<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A6B"/>
      <stop offset="1" stop-color="#0E7C86"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FF5E5B"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6F2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06122E" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background (opaque, square: iOS applies its own corner mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 4x4 board: unrevealed tiles raised, revealed tiles flat with numbers -->
  <g fill="#FFFFFF">
    <g fill-opacity="0.10">
      <rect x="72"  y="72"  width="200" height="200" rx="40"/>
      <rect x="296" y="72"  width="200" height="200" rx="40"/>
      <rect x="752" y="296" width="200" height="200" rx="40"/>
      <rect x="72"  y="752" width="200" height="200" rx="40"/>
      <rect x="752" y="752" width="200" height="200" rx="40"/>
      <rect x="528" y="752" width="200" height="200" rx="40"/>
    </g>
    <g fill-opacity="0.04">
      <rect x="528" y="72"  width="200" height="200" rx="40"/>
      <rect x="752" y="72"  width="200" height="200" rx="40"/>
      <rect x="72"  y="296" width="200" height="200" rx="40"/>
      <rect x="296" y="296" width="200" height="200" rx="40"/>
      <rect x="528" y="296" width="200" height="200" rx="40"/>
      <rect x="72"  y="528" width="200" height="200" rx="40"/>
      <rect x="296" y="528" width="200" height="200" rx="40"/>
      <rect x="528" y="528" width="200" height="200" rx="40"/>
      <rect x="752" y="528" width="200" height="200" rx="40"/>
      <rect x="296" y="752" width="200" height="200" rx="40"/>
    </g>
  </g>
  <g font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="120" text-anchor="middle" fill-opacity="0.55">
    <text x="628" y="886" fill="#FFB3B0">3</text>
    <text x="172" y="438" fill="#9CF5B8">2</text>
    <text x="852" y="662" fill="#8FD3FF">1</text>
  </g>

  <!-- The mark: a flagpole + pennant that reads as an "F" -->
  <g filter="url(#shadow)">
    <!-- waving pennant = top arm of the F -->
    <path d="M380 214
             C 520 170, 600 250, 760 196
             C 790 186, 806 206, 792 230
             L 736 330
             C 726 348, 726 356, 736 374
             L 792 474
             C 806 498, 790 516, 760 506
             C 600 452, 520 532, 380 488 Z"
          fill="url(#flag)"/>
    <!-- middle arm of the F: a small revealed tile -->
    <rect x="396" y="560" width="200" height="104" rx="34" fill="#FFFFFF"/>
    <!-- pole = stem of the F -->
    <rect x="300" y="180" width="112" height="680" rx="56" fill="url(#pole)"/>
    <!-- base -->
    <rect x="244" y="820" width="224" height="72" rx="36" fill="#FFFFFF"/>
  </g>
</svg>
